<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - ITE 200 E Class Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body>
    <header>
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
            <img src="multimedia/usted.jpg" class="header-logo">
            ITE 200 E Class Portal
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="timetable.html">Timetable</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 style="text-align: center; color:#722F37; font-style: italic;">Contact Us</h2>
        <br>
        <p style="text-align: center; margin-bottom: 2rem;">If you have any questions, fill out the form below to reach the class representative.</p>
        
        <form id="contact-form">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label for="email">Your Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address">
            </div>
            
            <div class="form-group">
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required placeholder="What do you want to tell us?"></textarea>
            </div>
            
            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> USTED ITE 200 E Class Portal. All rights reserved.</p>
         <div class="social-icons">
            <a href="https://web.facebook.com/aamustedk/?_rdc=1&_rdr#" target="_blank" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="https://www.instagram.com/aamusted_gh/" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
